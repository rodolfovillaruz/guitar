name: CI

permissions:
  contents: write   # required for creating a release

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*.*.*'   # Trigger release on tags like v1.0.0
  pull_request:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --all-features

      - name: Rename binary per OS
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            mv target/release/guitar target/release/guitar-linux
          elif [ "$RUNNER_OS" == "macOS" ]; then
            mv target/release/guitar target/release/guitar-macos
          fi
        shell: bash

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.os }}-binary
          path: |
            target/release/guitar-linux
            target/release/guitar-macos
            target/release/guitar.exe

  sign:
    name: Sign binaries
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')   # only run on tag push
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Flatten artifact directory
        run: |
          mkdir -p artifacts_flat
          cp -r artifacts/*/* artifacts_flat/ || true
          ls -R artifacts_flat

      - name: Install minisign
        run: sudo apt-get update -q && sudo apt-get install -y -q minisign

      # Writes <binary>.sig next to each binary, which is where cargo-binstall
      # looks for it (see [package.metadata.binstall.signing] in Cargo.toml).
      - name: Sign binaries
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          key="$RUNNER_TEMP/minisign.key"
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          for f in artifacts_flat/*; do
            minisign -S -s "$key" -m "$f" -x "$f.sig" \
              -t "guitar ${GITHUB_REF_NAME} $(basename "$f")"
          done
          rm -f "$key"

      # Fails the release if the secret key doesn't match the public key
      # that binstall users verify against.
      - name: Verify signatures against Cargo.toml public key
        run: |
          pubkey=$(sed -n 's/^pubkey = "\(.*\)"$/\1/p' Cargo.toml)
          for f in artifacts_flat/*.sig; do
            minisign -V -P "$pubkey" -m "${f%.sig}" -x "$f"
          done

      - name: Upload signed binaries
        uses: actions/upload-artifact@v7
        with:
          name: signed-binaries
          path: artifacts_flat/*

  release:
    name: Create GitHub Release
    needs: sign
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')   # only run on tag push
    steps:
      - name: Download signed binaries
        uses: actions/download-artifact@v8
        with:
          name: signed-binaries
          path: artifacts_flat

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts_flat/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  upload-r2:
    name: Upload binaries to Cloudflare R2
    needs: sign
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')   # only run on tag push
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      # R2 rejects the default checksum headers sent by recent AWS CLI v2 releases.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      # The bucket is in the EU jurisdiction, which has its own endpoint.
      R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.eu.r2.cloudflarestorage.com
      R2_BUCKET: guitar
    steps:
      - name: Download signed binaries
        uses: actions/download-artifact@v8
        with:
          name: signed-binaries
          path: artifacts_flat

      - name: Upload versioned binaries
        run: |
          aws s3 cp artifacts_flat/ "s3://${R2_BUCKET}/${GITHUB_REF_NAME}/" \
            --recursive --endpoint-url "$R2_ENDPOINT"

      - name: Update latest binaries
        run: |
          aws s3 cp artifacts_flat/ "s3://${R2_BUCKET}/latest/" \
            --recursive --endpoint-url "$R2_ENDPOINT"
