name: CI

permissions:
  contents: write   # required for creating a release

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*.*.*'   # Trigger release on tags like v1.0.0
  pull_request:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --all-features

      - name: Rename binary per OS
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            mv target/release/guitar target/release/guitar-linux
          elif [ "$RUNNER_OS" == "macOS" ]; then
            mv target/release/guitar target/release/guitar-macos
          fi
        shell: bash

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.os }}-binary
          path: |
            target/release/guitar-linux
            target/release/guitar-macos
            target/release/guitar.exe

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')   # only run on tag push
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Flatten artifact directory
        run: |
          mkdir -p artifacts_flat
          cp -r artifacts/*/* artifacts_flat/ || true
          ls -R artifacts_flat

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts_flat/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  upload-r2:
    name: Upload binaries to Cloudflare R2
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')   # only run on tag push
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      # R2 rejects the default checksum headers sent by recent AWS CLI v2 releases.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      # The bucket is in the EU jurisdiction, which has its own endpoint.
      R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.eu.r2.cloudflarestorage.com
      R2_BUCKET: guitar
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Flatten artifact directory
        run: |
          mkdir -p artifacts_flat
          cp -r artifacts/*/* artifacts_flat/ || true
          ls -R artifacts_flat

      - name: Upload versioned binaries
        run: |
          aws s3 cp artifacts_flat/ "s3://${R2_BUCKET}/${GITHUB_REF_NAME}/" \
            --recursive --endpoint-url "$R2_ENDPOINT"

      - name: Update latest binaries
        run: |
          aws s3 cp artifacts_flat/ "s3://${R2_BUCKET}/latest/" \
            --recursive --endpoint-url "$R2_ENDPOINT"
